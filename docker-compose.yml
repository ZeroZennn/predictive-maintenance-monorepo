# Lapis AI - Predictive Maintenance SaaS
# Docker Compose - Root Orchestrator v1.0

# CARA PAKAI:
#   Jalankan infrastructure saja (development):
#     docker compose up -d

#   Jalankan SEMUA service termasuk aplikasi (production/staging):
#     docker compose --profile app up -d

services:
  # Application Services (Aktif hanya dengan --profile app)
  # Dinonaktifkan dulu karena Dockerfile belum ada.
  # Akan dikonfigurasi penuh saat Fase dari seluruh role selesai.

  backend:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lapis_backend
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - lapis_network

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lapis_frontend
    restart: unless-stopped
    mem_limit: 150m
    environment:
      - INTERNAL_BACKEND_URL=http://backend:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - lapis_network

  # Infrastructure Services (Selalu aktif)
  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: lapis_qdrant
    restart: unless-stopped
    mem_limit: 200m
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - lapis_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null && echo OK || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ml-service:
    build:
      context: ./machine_learning
      dockerfile: Dockerfile.ml
    container_name: lapis-ml-service
    mem_limit: 500m
    ports:
      - "${ML_ENGINE_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_NUM_INTEROP_THREADS=1
      - TF_NUM_INTRAOP_THREADS=1
      - OMP_NUM_THREADS=1
      - TF_FORCE_GPU_ALLOW_GROWTH=true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - lapis_network

  nlp-service:
    build:
      context: .
      dockerfile: nlp/Dockerfile.nlp
    container_name: lapis-nlp-service
    mem_limit: 450m
    ports:
      - "${NLP_ENGINE_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://:${REDIS_PASSWORD:-lapis_redis_secret}@redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BACKEND_URL=http://host.docker.internal:3000
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    volumes:
      - nlp_qdrant_data:/app/nlp/data/vector_db/qdrant
      - ./nlp/data/raw:/app/nlp/data/raw
      - ./nlp/data/processed:/app/nlp/data/processed
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/nlp/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lapis_network

  postgres:
    image: postgres:15-alpine
    container_name: lapis_postgres
    restart: unless-stopped
    mem_limit: 300m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lapis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lapis_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lapis_ai_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lapis_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lapis_user} -d ${POSTGRES_DB:-lapis_ai_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Database terpisah khusus time-series sensor
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: lapis_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lapis_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lapis_secret}
      POSTGRES_DB: lapis_timeseries_db
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - lapis_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-lapis_user} -d lapis_timeseries_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: lapis_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-lapis_redis_secret}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - lapis_network
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-lapis_redis_secret}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Named Volumes
volumes:
  postgres_data:
    driver: local
  timescaledb_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  nlp_qdrant_data:
    driver: local
  uploads_data:
    driver: local

# Networks
networks:
  lapis_network:
    driver: bridge
